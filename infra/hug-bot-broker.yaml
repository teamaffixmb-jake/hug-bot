AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Hug-Bot MQTT broker for two ESP32s. AWS IoT Core with a dedicated custom-auth
  endpoint so devices connect with TLS + a username/password (no X.509 client
  certs). Cost at hug-bot scale is typically $0 in the first year and about a
  cent a month after that.

# Deploy:
#   TOKEN_A=$(openssl rand -hex 16)
#   TOKEN_B=$(openssl rand -hex 16)
#   aws cloudformation deploy \
#     --stack-name hug-bot \
#     --template-file infra/hug-bot-broker.yaml \
#     --capabilities CAPABILITY_IAM \
#     --parameter-overrides DeviceAToken="$TOKEN_A" DeviceBToken="$TOKEN_B"
#
# Then:
#   aws cloudformation describe-stacks --stack-name hug-bot \
#     --query 'Stacks[0].Outputs'
#
# Each device:
#   host     = MqttEndpoint output
#   port     = 8883
#   clientId = DeviceAId or DeviceBId (must match username)
#   username = same as clientId
#   password = that device's token
#   TLS      = Amazon Root CA 1
#             https://www.amazontrust.com/repository/AmazonRootCA1.pem
#   subscribe hugbot/<own-id>/inbox   QoS 1
#   publish   hugbot/<peer-id>/inbox  QoS 1
#   payload   keep tiny (a few bytes). Do not set the MQTT retain flag.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Devices
        Parameters:
          - DeviceAId
          - DeviceBId
          - DeviceAToken
          - DeviceBToken
          - TopicPrefix

Parameters:
  DeviceAId:
    Type: String
    Default: hug-a
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    ConstraintDescription: letters, digits, underscore, hyphen
    MaxLength: 64
    Description: MQTT client ID / username for the first board.

  DeviceBId:
    Type: String
    Default: hug-b
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    ConstraintDescription: letters, digits, underscore, hyphen
    MaxLength: 64
    Description: MQTT client ID / username for the second board.

  DeviceAToken:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 64
    AllowedPattern: "^[A-Za-z0-9._~-]+$"
    ConstraintDescription: 16–64 URL-safe characters
    Description: MQTT password for device A. Generate with openssl rand -hex 16.

  DeviceBToken:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 64
    AllowedPattern: "^[A-Za-z0-9._~-]+$"
    ConstraintDescription: 16–64 URL-safe characters
    Description: MQTT password for device B. Generate with openssl rand -hex 16.

  TopicPrefix:
    Type: String
    Default: hugbot
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    MaxLength: 32
    Description: First MQTT topic segment. Inbox topics are {prefix}/{deviceId}/inbox.

Rules:
  DistinctDeviceIds:
    Assertions:
      - Assert: !Not [!Equals [!Ref DeviceAId, !Ref DeviceBId]]
        AssertDescription: DeviceAId and DeviceBId must be different.
  DistinctTokens:
    Assertions:
      - Assert: !Not [!Equals [!Ref DeviceAToken, !Ref DeviceBToken]]
        AssertDescription: DeviceAToken and DeviceBToken must be different.

Resources:
  DeviceAThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Ref DeviceAId
      AttributePayload:
        Attributes:
          peer: !Ref DeviceBId
          role: hug-bot

  DeviceBThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Ref DeviceBId
      AttributePayload:
        Attributes:
          peer: !Ref DeviceAId
          role: hug-bot

  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-authorizer"
      RetentionInDays: 7

  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: describe-iot-domain
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iot:DescribeDomainConfiguration
                Resource: "*"

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuthorizerLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-authorizer"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AuthorizerRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          DEVICE_A_ID: !Ref DeviceAId
          DEVICE_B_ID: !Ref DeviceBId
          DEVICE_A_TOKEN: !Ref DeviceAToken
          DEVICE_B_TOKEN: !Ref DeviceBToken
          TOPIC_PREFIX: !Ref TopicPrefix
          ACCOUNT_ID: !Ref AWS::AccountId
      Code:
        ZipFile: |
          import base64, hmac, json, os, time, urllib.request, boto3
          def send(e, st, data, reason=""):
              rid = e.get("PhysicalResourceId") or "hugbot-ep"
              body = json.dumps({
                  "Status": st, "Reason": (reason or st)[:200],
                  "PhysicalResourceId": rid, "StackId": e["StackId"],
                  "RequestId": e["RequestId"],
                  "LogicalResourceId": e["LogicalResourceId"], "Data": data,
              }).encode()
              req = urllib.request.Request(e["ResponseURL"], data=body, method="PUT")
              req.add_header("Content-Type", "")
              urllib.request.urlopen(req)
          def cfn(e, _c):
              try:
                  if e["RequestType"] == "Delete":
                      send(e, "SUCCESS", {}); return
                  name = e["ResourceProperties"]["DomainConfigurationName"]
                  iot = boto3.client("iot")
                  dn = ""
                  for _ in range(8):
                      d = iot.describe_domain_configuration(domainConfigurationName=name)
                      dn = d.get("domainName") or ""
                      if dn:
                          break
                      time.sleep(2)
                  if not dn:
                      raise RuntimeError("domainName not ready")
                  send(e, "SUCCESS", {"DomainName": dn})
              except Exception as err:
                  send(e, "FAILED", {}, str(err))
          def deny():
              return {
                  "isAuthenticated": False, "principalId": "deny",
                  "disconnectAfterInSeconds": 300, "refreshAfterInSeconds": 300,
                  "policyDocuments": [],
              }
          def auth(e, _c):
              m = (e.get("protocolData") or {}).get("mqtt") or {}
              cid = m.get("clientId") or ""
              user = (m.get("username") or "").split("?")[0]
              try:
                  pw = base64.b64decode(m.get("password") or "").decode().strip()
              except Exception:
                  return deny()
              a, b = os.environ["DEVICE_A_ID"], os.environ["DEVICE_B_ID"]
              toks = {a: os.environ["DEVICE_A_TOKEN"], b: os.environ["DEVICE_B_TOKEN"]}
              peer = {a: b, b: a}
              if cid != user or cid not in toks or not hmac.compare_digest(pw, toks[cid]):
                  return deny()
              region, acct = os.environ["AWS_REGION"], os.environ["ACCOUNT_ID"]
              pfx = os.environ["TOPIC_PREFIX"]
              root = f"arn:aws:iot:{region}:{acct}"
              inbox = f"{pfx}/{cid}/inbox"
              pinbox = f"{pfx}/{peer[cid]}/inbox"
              pid = "".join(ch for ch in cid if ch.isalnum())[:128] or "device"
              return {
                  "isAuthenticated": True, "principalId": pid,
                  "disconnectAfterInSeconds": 86400, "refreshAfterInSeconds": 3600,
                  "policyDocuments": [{
                      "Version": "2012-10-17",
                      "Statement": [
                          {"Effect": "Allow", "Action": "iot:Connect",
                           "Resource": f"{root}:client/{cid}"},
                          {"Effect": "Allow", "Action": "iot:Subscribe",
                           "Resource": f"{root}:topicfilter/{inbox}"},
                          {"Effect": "Allow", "Action": "iot:Receive",
                           "Resource": f"{root}:topic/{inbox}"},
                          {"Effect": "Allow", "Action": "iot:Publish",
                           "Resource": [
                               f"{root}:topic/{inbox}",
                               f"{root}:topic/{pinbox}",
                           ]},
                      ],
                  }],
              }
          def handler(e, c):
              if "RequestType" in e:
                  return cfn(e, c)
              return auth(e, c)

  Authorizer:
    Type: AWS::IoT::Authorizer
    Properties:
      AuthorizerName: !Sub "${AWS::StackName}-auth"
      AuthorizerFunctionArn: !GetAtt AuthorizerFunction.Arn
      SigningDisabled: true
      Status: ACTIVE
      Tags:
        - Key: Project
          Value: hug-bot

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt Authorizer.Arn

  MqttDomain:
    Type: AWS::IoT::DomainConfiguration
    DependsOn: AuthorizerInvokePermission
    Properties:
      DomainConfigurationName: !Sub "${AWS::StackName}-mqtt"
      DomainConfigurationStatus: ENABLED
      ServiceType: DATA
      ApplicationProtocol: SECURE_MQTT
      AuthenticationType: CUSTOM_AUTH
      AuthorizerConfig:
        AllowAuthorizerOverride: false
        DefaultAuthorizerName: !Ref Authorizer
      Tags:
        - Key: Project
          Value: hug-bot

  MqttEndpointLookup:
    Type: Custom::MqttEndpoint
    DependsOn: MqttDomain
    Properties:
      ServiceToken: !GetAtt AuthorizerFunction.Arn
      DomainConfigurationName: !Ref MqttDomain

Outputs:
  MqttEndpoint:
    Description: Hostname the boards connect to (port 8883, MQTT over TLS).
    Value: !GetAtt MqttEndpointLookup.DomainName

  MqttPort:
    Description: MQTT over TLS port.
    Value: "8883"

  DeviceAId:
    Description: Client ID and username for the first board.
    Value: !Ref DeviceAId

  DeviceBId:
    Description: Client ID and username for the second board.
    Value: !Ref DeviceBId

  DeviceAInboxTopic:
    Description: Topic device A subscribes to; device B publishes here.
    Value: !Sub "${TopicPrefix}/${DeviceAId}/inbox"

  DeviceBInboxTopic:
    Description: Topic device B subscribes to; device A publishes here.
    Value: !Sub "${TopicPrefix}/${DeviceBId}/inbox"

  AmazonRootCA:
    Description: Trust store file to flash onto both ESP32s.
    Value: https://www.amazontrust.com/repository/AmazonRootCA1.pem
